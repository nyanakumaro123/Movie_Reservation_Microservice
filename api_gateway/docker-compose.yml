services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_api_gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AUTH_SERVICE_URL=http://laravel_app:80
      - INVENTORY_SERVICE_URL=http://inventory_laravel_app:80
      - BOOKING_SERVICE_URL=http://booking_express_app:9000
    networks:
      - bioskop-network

networks:
  bioskop-network:
    external: true     