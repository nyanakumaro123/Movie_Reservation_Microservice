<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Successful</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="text-center max-w-md">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-green-900/50 mb-6">
            <svg class="w-10 h-10 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">Payment Successful!</h1>
        <p class="text-gray-400 mb-1">Your seats are reserved.</p>
        <p class="text-sm text-gray-600 mb-8">Order ID: <span id="order-id" class="font-mono text-gray-400"></span></p>
        <a href="/"
           class="inline-block px-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-semibold transition-all">
            ← Back to Checkout
        </a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const el = document.getElementById('order-id');
        if (el) el.textContent = params.get('order_id') ?? '—';
    </script>
</body>
</html>
